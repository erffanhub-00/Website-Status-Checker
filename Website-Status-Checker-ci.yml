name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate sites.json
        run: python3 -m json.tool sites.json > /dev/null
      - name: Check JS syntax
        run: node --check assets/js/app.js
