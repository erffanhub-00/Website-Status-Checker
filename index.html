<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="بررسی لحظه‌ای در دسترس بودن سایت‌ها از مرورگر — بدون نیاز به سرور" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='38' fill='%2322c55e'/%3E%3C/svg%3E" />
    <title>وضعیت سرویس‌ها | Status Page</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>مانیتورینگ سرویس‌ها</h1>
                <p id="lastUpdate">آخرین بروزرسانی: در حال بارگذاری...</p>
            </div>
            <button id="refreshBtn" type="button">
                <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><polyline points="21 3 21 9 15 9" /></svg>
                <span class="btn-text">بروزرسانی</span>
            </button>
        </header>

        <div id="overallStatus" class="overall-status checking" aria-live="polite">
            <span class="status-icon checking"></span>
            <span class="status-badge">در حال بررسی…</span>
        </div>

        <div id="skippedWarning" class="skipped-warning" role="status" hidden></div>

        <div id="sitesList" class="sites-grid" aria-live="polite"></div>

        <footer>
            <p>داده‌ها از فایل sites.json خوانده می‌شوند.</p>
            <p>وضعیت «در دسترس» یعنی سرور در سطح شبکه پاسخ داده است؛ کد وضعیت HTTP از یک صفحه استاتیک قابل خواندن نیست.</p>
        </footer>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
